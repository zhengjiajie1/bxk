# Redis配置
spring:
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

# 这里仅为示例配置，保留原端口号9321，但添加注释说明如何更改端口号
server:
  port: 9321  # 如果遇到端口冲突，可以修改为其他可用端口，比如9322, 9323等 